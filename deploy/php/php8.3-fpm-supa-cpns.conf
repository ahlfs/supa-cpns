; SUPA CPNS — PHP-FPM pool for the Laravel site on cpns.buatjalan.xyz.
;
; Installed to /etc/php/8.3/fpm/pool.d/supa-cpns.conf by deploy/host-cpns.sh.
;
; The pool is separate from `www` and from SinatriaApp's pool for the reason the
; site exists at all: a runaway worker, a changed memory limit or a crashed pool
; here cannot take another site on this host down with it. The socket is owned by
; caddy, so Caddy — not the internet — is the only client.
;
; opcache.validate_timestamps stays on: publishing a change is then `artisan
; optimize` plus a pool reload, and a deploy that only rewrites Blade does not
; need root. The cost is a stat per file per request, which is the right trade on
; a host where the app is edited far more often than it is hammered.
[supa-cpns]
user = ahlfs
group = ahlfs
listen = /run/php/php8.3-fpm-supa-cpns.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660
listen.backlog = 511
chdir = /home/ahlfs/workspace/supa-cpns
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 120s
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /var/log/php8.3-fpm-supa-cpns.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
php_admin_value[max_execution_time] = 120
php_admin_flag[session.upload_progress.enabled] = off
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.max_accelerated_files] = 10000
php_admin_flag[opcache.validate_timestamps] = on
php_admin_value[realpath_cache_size] = 4096K
env[PATH] = /usr/local/bin:/usr/bin:/bin
